[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-safe-dns-cutover"
version = "0.1.0"
description = "A typed Python DNS cutover service that protects active appointment workflows."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
health-dns-cutover = "health_dns_cutover.cutover_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
